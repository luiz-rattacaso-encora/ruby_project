---
openapi: 3.0.1
info:
  title: API V1
  version: v1
paths:
  "/announcements.json":
    get:
      summary: Lists all announcements
      tags:
      - Announcements
      parameters:
      - name: team_id
        in: query
        required: false
        description: Filter by team ID
        schema:
          type: integer
      - name: author_name
        in: query
        required: false
        description: Filter by author name
        schema:
          type: string
      responses:
        '200':
          description: announcements listed successfully
        '401':
          description: employee profile not found
    post:
      summary: Creates a new announcement
      tags:
      - Announcements
      parameters: []
      responses:
        '201':
          description: announcement created
        '403':
          description: forbidden to post for this team
        '422':
          description: unprocessable entity
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                announcement:
                  type: object
                  properties:
                    title:
                      type: string
                    content:
                      type: string
                    team_id:
                      type: integer
                  required:
                  - title
                  - content
                  - team_id
  "/announcements/{id}.json":
    parameters:
    - name: id
      in: path
      description: Announcement ID
      required: true
      schema:
        type: integer
    get:
      summary: Retrieves a specific announcement
      tags:
      - Announcements
      responses:
        '200':
          description: announcement found
        '403':
          description: forbidden to view announcement
        '404':
          description: announcement not found
    patch:
      summary: Updates an announcement
      tags:
      - Announcements
      parameters: []
      responses:
        '200':
          description: announcement updated
        '403':
          description: forbidden to modify announcement
        '422':
          description: unprocessable entity
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                announcement:
                  type: object
                  properties:
                    title:
                      type: string
                    content:
                      type: string
                    team_id:
                      type: integer
    delete:
      summary: Deletes an announcement
      tags:
      - Announcements
      responses:
        '204':
          description: announcement deleted
        '403':
          description: forbidden to delete announcement
  "/employees.json":
    get:
      summary: Retrieves the current logged-in employee profile
      tags:
      - Employees
      responses:
        '200':
          description: employee found
        '404':
          description: employee not found
    post:
      summary: Creates a new employee and user
      tags:
      - Employees
      parameters: []
      responses:
        '201':
          description: employee created
        '403':
          description: only managers can create employees
        '422':
          description: unprocessable entity
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                employee:
                  type: object
                  properties:
                    first_name:
                      type: string
                    last_name:
                      type: string
                    role:
                      type: string
                    is_manager:
                      type: boolean
                    manager_id:
                      type: integer
                    user_attributes:
                      type: object
                      properties:
                        email_address:
                          type: string
                        password:
                          type: string
                        password_confirmation:
                          type: string
                      required:
                      - email_address
                      - password
                      - password_confirmation
                  required:
                  - first_name
                  - last_name
                  - role
  "/employees/all.json":
    get:
      summary: Lists all employees
      tags:
      - Employees
      parameters:
      - name: search_name
        in: query
        required: false
        description: Search by employee name
        schema:
          type: string
      responses:
        '200':
          description: employees listed successfully
  "/employees/{id}.json":
    parameters:
    - name: id
      in: path
      description: Employee ID
      required: true
      schema:
        type: integer
    get:
      summary: Retrieves details of a specific employee
      tags:
      - Employees
      responses:
        '200':
          description: employee found
        '404':
          description: employee not found
    patch:
      summary: Updates an employee
      tags:
      - Employees
      parameters: []
      responses:
        '200':
          description: employee updated
        '403':
          description: forbidden to update employee
        '422':
          description: unprocessable entity
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                employee:
                  type: object
                  properties:
                    first_name:
                      type: string
                    last_name:
                      type: string
                    role:
                      type: string
                    is_manager:
                      type: boolean
                    manager_id:
                      type: integer
    delete:
      summary: Deletes an employee
      tags:
      - Employees
      responses:
        '204':
          description: employee deleted
        '403':
          description: forbidden to delete employee
  "/memberships":
    get:
      summary: Lists active team memberships
      tags:
      - Memberships
      parameters:
      - name: search_name
        in: query
        required: false
        description: Filter by employee name
        schema:
          type: string
      responses:
        '200':
          description: memberships listed successfully
    post:
      summary: Adds an employee to a team
      tags:
      - Memberships
      parameters: []
      responses:
        '201':
          description: membership created
        '422':
          description: unprocessable entity
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                membership:
                  type: object
                  properties:
                    employee_id:
                      type: integer
                    team_id:
                      type: integer
                  required:
                  - employee_id
                  - team_id
  "/memberships/{id}":
    parameters:
    - name: id
      in: path
      description: Membership ID
      required: true
      schema:
        type: integer
    get:
      summary: Retrieves details of a membership
      tags:
      - Memberships
      responses:
        '200':
          description: membership found
        '404':
          description: membership not found
    patch:
      summary: Updates a membership
      tags:
      - Memberships
      parameters: []
      responses:
        '200':
          description: membership updated
        '422':
          description: unprocessable entity
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                membership:
                  type: object
                  properties:
                    employee_id:
                      type: integer
                    team_id:
                      type: integer
    delete:
      summary: Finishes a membership (sets finished_at timestamp)
      tags:
      - Memberships
      responses:
        '204':
          description: membership finished
        '422':
          description: could not finish membership
  "/teams.json":
    get:
      summary: Lists all teams
      tags:
      - Teams
      parameters:
      - name: search_name
        in: query
        required: false
        description: Search team by name
        schema:
          type: string
      responses:
        '200':
          description: teams listed successfully
    post:
      summary: Creates a new team
      tags:
      - Teams
      parameters: []
      responses:
        '201':
          description: team created
        '422':
          description: unprocessable content
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                team:
                  type: object
                  properties:
                    name:
                      type: string
                    description:
                      type: string
                    technologies:
                      type: string
                  required:
                  - name
  "/teams/{id}.json":
    parameters:
    - name: id
      in: path
      description: Team ID
      required: true
      schema:
        type: integer
    get:
      summary: Retrieves details of a team
      tags:
      - Teams
      responses:
        '200':
          description: team found
    patch:
      summary: Updates a team
      tags:
      - Teams
      parameters: []
      responses:
        '200':
          description: team updated
        '422':
          description: unprocessable content
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                team:
                  type: object
                  properties:
                    name:
                      type: string
                    description:
                      type: string
                    technologies:
                      type: string
    delete:
      summary: Deletes a team
      tags:
      - Teams
      responses:
        '204':
          description: team deleted
  "/teams/{team_id}/weekly_updates.json":
    parameters:
    - name: team_id
      in: path
      description: Team ID
      required: true
      schema:
        type: integer
    get:
      summary: Lists weekly updates for the current week of a team
      tags:
      - Weekly Updates
      parameters:
      - name: author_name
        in: query
        required: false
        description: Filter by author name
        schema:
          type: string
      - name: status
        in: query
        required: false
        description: Filter by status
        schema:
          type: string
      responses:
        '200':
          description: weekly updates listed successfully
        '403':
          description: forbidden to access this team
        '404':
          description: team not found
    post:
      summary: Creates a weekly update for a team
      tags:
      - Weekly Updates
      parameters: []
      responses:
        '201':
          description: weekly update created
        '403':
          description: forbidden to create update for this team
        '422':
          description: unprocessable entity
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                weekly_update:
                  type: object
                  properties:
                    content:
                      type: string
                    status:
                      type: string
                  required:
                  - content
                  - status
  "/weekly_updates/{id}.json":
    parameters:
    - name: id
      in: path
      description: Weekly Update ID
      required: true
      schema:
        type: integer
    get:
      summary: Retrieves a specific weekly update
      tags:
      - Weekly Updates
      responses:
        '200':
          description: weekly update found
        '403':
          description: forbidden to view this update
        '404':
          description: weekly update not found
    patch:
      summary: Updates a weekly update
      tags:
      - Weekly Updates
      parameters: []
      responses:
        '200':
          description: weekly update modified
        '403':
          description: forbidden to modify this update
        '422':
          description: unprocessable entity
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                weekly_update:
                  type: object
                  properties:
                    content:
                      type: string
                    status:
                      type: string
    delete:
      summary: Deletes a weekly update
      tags:
      - Weekly Updates
      responses:
        '204':
          description: weekly update deleted
        '403':
          description: forbidden to delete this update
servers:
- url: http://localhost:3000
  description: Local development server
  variables:
    defaultHost:
      default: www.example.com
